[pytest]
# rootdir is pharmacy-core-backend/, so `app` and `tests` are both importable
# without installing the project as a package.
testpaths = tests
pythonpath = .

addopts =
    -q
    --strict-markers
    --tb=short

markers =
    unit: fast, isolated tests of a single function or class
    integration: crosses a real boundary (DB, HTTP, full graph)
    evaluation: BI golden-case regression set
    known_gap: documents current behaviour that a later milestone will change

filterwarnings =
    ignore::DeprecationWarning
